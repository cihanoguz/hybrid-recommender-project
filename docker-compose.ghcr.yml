services:
  hybrid-recommender:
    image: ghcr.io/cihanoguz/hybrid-recommender-project:latest
    pull_policy: always
    container_name: hybrid-recommender
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
